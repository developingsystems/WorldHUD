name: Fundus Article Extraction

on:
  workflow_dispatch:
    inputs:
      chunk_timestamp:
        description: 'Chunk timestamp (YYYYMMDDHHMMSS) to extract'
        required: true
      urls:
        description: 'JSON-encoded list of article URLs'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fundus
      - name: Run extraction
        id: extract
        env:
          CHUNK_TIMESTAMP: ${{ github.event.inputs.chunk_timestamp }}
          URLS: ${{ github.event.inputs.urls }}
        run: python scripts/fundus_extract.py
      - name: Upload to GitHub Releases
        if: steps.extract.outputs.timestamp != 'skip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.extract.outputs.timestamp }}
        run: python scripts/upload_release.py
