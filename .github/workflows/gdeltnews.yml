name: GDELT NGram Article Reconstruction

on:
  schedule:
    # Run every minute we need a stage (6,21,36,51 for stage1; 17,32,47,2 for stage2)
    - cron: '6,21,36,51 * * * *'
    - cron: '17,32,47,2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install gdeltnews
        run: pip install gdeltnews
      - name: Determine stage
        id: stage
        run: |
          minute=$(date -u +%M)
          case $minute in
            06|21|36|51) echo "STAGE=stage1" >> $GITHUB_ENV ;;
            17|32|47|02) echo "STAGE=stage2" >> $GITHUB_ENV ;;
            *) echo "STAGE=none" >> $GITHUB_ENV ;;
          esac
      - name: Run pipeline
        if: env.STAGE != 'none'
        run: python scripts/gdeltnews_pipeline.py
      - name: Commit article files
        if: env.STAGE != 'none'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update gdeltnews articles (${{ env.STAGE }})"
          file_pattern: 'articles_*.json'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
