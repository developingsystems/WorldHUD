name: Reconstruct GDELT Full Articles

on:
  schedule:
    - cron: '6,21,36,51 * * * *'
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdeltnews
        run: |
          python -m pip install --upgrade pip
          pip install gdeltnews
      - name: Run reconstruction
        id: reconstruct
        run: python scripts/gdeltnews_pipeline.py
      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.reconstruct.outputs.timestamp }}
        run: python scripts/upload_release.py
